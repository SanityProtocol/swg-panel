name: sign-release

# Sign the release manifest, so a box can verify what it is about to install.
# See docs/UPDATE-RESILIENCE-PLAN.md, Phase A, and verify_fetched_tree() in bootstrap.sh.
#
# ⚠️ MANUAL, NOT ON PUSH, AND THAT IS THE POINT.
#
# This job COMMITS two files (MANIFEST.sha256 and its signature) to the branch it ran on. Signing every
# push would put a bot commit on top of every commit, which on `dev` is noise and on `main` is a direct
# breach of the standing rule that main carries ONE squashed commit per release whose parent is the
# previous release commit. A manual trigger makes signing a deliberate step in cutting a release, taken
# once, by the person cutting it.
#
# ⚠️ SIGN `dev`, THEN SQUASH ONTO `main` AS USUAL — do not run this against main.
#   The manifest lists file hashes and EXCLUDES itself and its own signature, so carrying it across the
#   squash does not invalidate it: the release commit's tree is byte-identical to the dev tree it came
#   from, which is the property the release process already relies on. Main therefore gains the signature
#   without gaining a commit, and the one-commit-per-release rule is untouched.
#
# Requires the repository secret RELEASE_SIGNING_KEY — the PEM of an ECDSA P-256 private key:
#     openssl ecparam -name prime256v1 -genkey -noout -out release-1.key
#     openssl ec -in release-1.key -pubout -out release-1.pub      # paste this into bootstrap.sh
# The public half must already be embedded in bootstrap.sh's emit_release_keys(), or nothing will be able
# to verify what this signs.

on:
  workflow_dispatch:
    inputs:
      ref:
        description: 'Branch to sign (use dev; the release squash carries it to main)'
        required: true
        default: 'dev'

permissions:
  contents: write

jobs:
  sign:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
          # The manifest is built from `git ls-files`, so the checkout must be a real work tree with
          # full history rather than a sparse or detached partial one.
          fetch-depth: 0

      - name: Refuse to sign without a key
        env:
          KEY: ${{ secrets.RELEASE_SIGNING_KEY }}
        run: |
          # Fail loudly rather than producing an unsigned "signed" release. A missing secret is the one
          # mistake that would otherwise look exactly like success.
          [ -n "$KEY" ] || { echo "::error::RELEASE_SIGNING_KEY is not set — nothing to sign with"; exit 1; }

      - name: Refuse to sign a tree whose public key nobody has
        run: |
          # A signature no box can check is worse than no signature: it looks like protection and is not.
          # bootstrap.sh is the only place a key can live (the verifier cannot ship inside the tree it
          # verifies), so if its key slot is still empty there is nothing to do here yet.
          if ! grep -q 'BEGIN PUBLIC KEY' bootstrap.sh; then
            echo "::error::bootstrap.sh carries no release public key — embed it in emit_release_keys() first, or nothing can verify this signature"
            exit 1
          fi

      - name: Generate and sign the manifest
        env:
          KEY: ${{ secrets.RELEASE_SIGNING_KEY }}
        run: |
          set -euo pipefail
          umask 077
          printf '%s\n' "$KEY" > "$RUNNER_TEMP/release.key"
          lib/release-manifest.sh generate
          lib/release-manifest.sh sign "$RUNNER_TEMP/release.key"
          # Check it the way a BOX will: against the keys actually embedded in bootstrap.sh, each tried in
          # turn. Verifying against the private key we just signed with would only prove openssl is
          # deterministic — it would pass just as happily if the public half shipped to users were wrong,
          # which is the one mistake that makes every install refuse the release.
          awk -v d="$RUNNER_TEMP" '/BEGIN PUBLIC KEY/{n++} n{print > (d "/relkey-" n ".pub")}' bootstrap.sh
          ok=no
          for k in "$RUNNER_TEMP"/relkey-*.pub; do
            [ -f "$k" ] || continue
            if openssl dgst -sha256 -verify "$k" -signature MANIFEST.sha256.sig MANIFEST.sha256 >/dev/null 2>&1; then
              ok=yes; break
            fi
          done
          [ "$ok" = yes ] || { echo "::error::the signature verifies against NO key embedded in bootstrap.sh — the key users will check with is not the key this signed with"; exit 1; }
          sha256sum -c --quiet MANIFEST.sha256
          shred -u "$RUNNER_TEMP/release.key" 2>/dev/null || rm -f "$RUNNER_TEMP/release.key"

      - name: Commit the signature
        run: |
          set -euo pipefail
          git config user.name  "swg release signer"
          git config user.email "noreply@users.noreply.github.com"
          git add -f MANIFEST.sha256 MANIFEST.sha256.sig
          if git diff --cached --quiet; then
            echo "manifest unchanged — nothing to commit"
            exit 0
          fi
          # [skip ci]: this commit adds only the manifest and its signature, which no image and no gate
          # depends on. Without it the docker workflow rebuilds and republishes four images for a change
          # that cannot affect any of them.
          git commit -m "release: sign the manifest for $(cat VERSION) [skip ci]"
          git push origin HEAD:${{ inputs.ref }}
